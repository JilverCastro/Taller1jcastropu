<!--
<!DOCTYPE html>	Le dice al navegador que es HTML5
lang="es"	Idioma de la página (accesibilidad y SEO)
<meta charset="UTF-8">	Soporte de tildes y ñ
<meta name="viewport">	Base para diseño responsive (lo usaremos con CSS)
<header>	Cabecera semántica del sitio
<nav aria-label="...">	Menú con nombre para lectores de pantalla
aria-current="page"	Indica cuál enlace es la página actual
<main>	Contenido principal (uno solo por página)
<footer> + <address>	Pie de página con datos de contacto
-->

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jilver Castro - Desarrollo Web Profesional</title>
        <meta name="description" content="Servicios profesionales de desarrollo web y diseño UX/UI." />
        <meta name="author" content="Jilver Castro" />
    </head>
    <body>
        <header>
            <h1>Jilver Castro</h1>
            <p>Desarrollo Web Profesional</p>

            <!-- Contenedor para el menú de navegación que se cargará dinámicamente -->
            <div id="navbar"></div>

        </header>

        <main>
            <section id="hero">
                <h2>Transformamos ideas en soluciones digitales</h2>
                <p>
                    Somos especialistas en desarrollo web moderno, diseño UX/UI y consultoría técnica. Creamos
                    experiencias digitales que conectan con tu audiencia.
                </p>
            </section>
        </main>

        <!-- Contenedor para el pie de página que se cargará dinámicamente -->
        <div id="footer"></div>

        <!-- Carga del script que incluye el menú de navegación y el pie de página -->
        <script src="/js/includes.js"></script>
    </body>
</html>
